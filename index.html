    <style>
        :root {
            --portal-green: #89d819;
            --portal-dark: #1b4504;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background: radial-gradient(circle at center, #1b0a2b 0%, #05020a 100%);
            color: white;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
            opacity: 0.85;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 10px var(--portal-green), inset 0 0 10px var(--portal-green); }
            50% { box-shadow: 0 0 30px var(--portal-green), inset 0 0 20px var(--portal-green); }
            100% { box-shadow: 0 0 10px var(--portal-green), inset 0 0 10px var(--portal-green); }
        }

        @keyframes spin-portal {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-portal 10s linear infinite;
        }

        .portal-border {
            border: 4px solid var(--portal-green);
            animation: pulse-glow 2s infinite ease-in-out;
        }

        .glitch-hover:hover {
            animation: glitch 0.3s linear infinite;
            color: #fff;
            text-shadow: 2px 0 var(--portal-green), -2px 0 #e43f5a;
        }

        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }

        .rm-button {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--portal-green);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .rm-button::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: var(--portal-green);
            transition: all 0.4s ease;
            z-index: -1;
        }

        .rm-button:hover::before {
            left: 0;
        }

        .rm-button:hover {
            color: black;
            box-shadow: 0 0 15px var(--portal-green);
            transform: translateY(-3px);
            font-weight: 800;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #000;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--portal-green);
            border-radius: 4px;
        }
        
        .music-btn {
            border-style: dashed;
            cursor: pointer;
        }
        .music-btn:hover {
            transform: scale(1.05);
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--portal-green);
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 8px var(--portal-green);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(137, 216, 25, 0.3);
            border-radius: 2px;
        }
        input[type=range]:focus {
            outline: none;
        }
        input[type=range]::-moz-range-thumb {
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--portal-green);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 8px var(--portal-green);
        }
        input[type=range]::-moz-range-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(137, 216, 25, 0.3);
            border-radius: 2px;
        }
    </style>
</head>
<body class="antialiased flex items-center justify-center p-4 sm:p-8">

    <script>
        const bgMusic = document.getElementById('bgMusic');
        const musicIcon = document.getElementById('musicIcon');
        const musicText = document.getElementById('musicText');
        const volumeSlider = document.getElementById('volumeSlider');
        let isPlaying = false;
        let isSongSelected = false;

        const playlist = [
            "Rick and Morty Official Soundtrack  Don't Look Back (Diane's Version) - Ryan Elder & Kotomi.mp3",
            "Rick and Morty Official Soundtrack  For Ages - WaxWane & Ryan Elder  Rick and Morty.mp3",
            "Rick and Morty Official Soundtrack  Dimensional Infrastructure - Ryan Elder  Rick and Morty.mp3"
        ];

        window.addEventListener('DOMContentLoaded', () => {
            if (!isSongSelected) {
                const randomSong = playlist[Math.floor(Math.random() * playlist.length)];
                bgMusic.src = randomSong;
                isSongSelected = true;
            }
            
            bgMusic.volume = volumeSlider.value;

            const playPromise = bgMusic.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    musicIcon.classList.remove('fa-play');
                    musicIcon.classList.add('fa-pause');
                    musicText.innerText = "Pause Theme";
                    isPlaying = true;
                }).catch(error => {
                    console.log("Autoplay blocked by browser policy. User must interact first.");
                });
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            bgMusic.volume = e.target.value;
        });

        function toggleMusic() {
            if (!isSongSelected) {
                const randomSong = playlist[Math.floor(Math.random() * playlist.length)];
                bgMusic.src = randomSong;
                isSongSelected = true;
                showToast("Loading random track...");
            }

            if (isPlaying) {
                bgMusic.pause();
                musicIcon.classList.remove('fa-pause');
                musicIcon.classList.add('fa-play');
                musicText.innerText = "Play Theme";
                isPlaying = false;
            } else {
                bgMusic.volume = volumeSlider.value;
                bgMusic.play().catch(error => {
                    console.error("Audio playback failed:", error);
                    showToast("Browser prevented audio playback.");
                });
                musicIcon.classList.remove('fa-play');
                musicIcon.classList.add('fa-pause');
                musicText.innerText = "Pause Theme";
                isPlaying = true;
            }
        }

        function shareProfile() {
            const url = window.location.href;
            if (navigator.share) {
                navigator.share({
                    title: 'Skeetek | Links',
                    url: url
                }).catch(console.error);
            } else {
                // Fallback to clipboard copy
                const textArea = document.createElement("textarea");
                textArea.value = url;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast("Link copied to clipboard!");
                } catch (err) {
                    console.error('Failed to copy', err);
                }
                document.body.removeChild(textArea);
            }
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.className = 'fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-[#89d819] text-black px-6 py-3 rounded-full font-bold shadow-[0_0_15px_#89d819] z-50 transition-opacity duration-500 font-["Orbitron"]';
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => document.body.removeChild(toast), 500);
            }, 2000);
        }
    </script>
